<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>紙めくり — Markdown Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.10/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.10/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.10/contrib/auto-render.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-raised:#FFFDF9;
    --ink:#1C1B1A;
    --ink-soft:#57524A;
    --accent:#2F6F62;
    --accent-soft:#DCEAE6;
    --line:#E4DFD3;
    --line-strong:#D2CBBB;
    --danger:#B24C3C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding:14px 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .topbar-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{
    display:flex;align-items:baseline;gap:8px;
  }
  .brand-mark{
    font-family:'Lora',serif;font-weight:700;font-style:italic;
    font-size:20px;color:var(--ink);
  }
  .brand-sub{
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  .stitch{
    margin-top:10px;height:1px;
    background-image:linear-gradient(to right, var(--line-strong) 60%, transparent 0%);
    background-position:top;background-size:8px 1px;background-repeat:repeat-x;
  }
  .import-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--ink);color:var(--paper);
    border:none;border-radius:100px;
    padding:9px 16px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    cursor:pointer;flex-shrink:0;
    transition:transform .15s ease, background .15s ease;
  }
  .import-btn:active{transform:scale(.96);}
  .import-btn svg{width:15px;height:15px;flex-shrink:0;}

  /* ---------- Empty state ---------- */
  .empty{
    min-height:calc(100dvh - 78px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 28px;text-align:center;
    transition:background .2s ease;
  }
  .empty.dragover{background:var(--accent-soft);}
  .empty-corner{
    width:64px;height:64px;margin-bottom:22px;position:relative;
  }
  .empty-corner svg{width:100%;height:100%;}
  .empty h1{
    font-family:'Lora',serif;font-weight:600;font-size:22px;margin:0 0 8px;
    color:var(--ink);
  }
  .empty p{
    font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 26px;max-width:280px;
  }
  .empty-cta{
    background:var(--accent);color:#fff;border:none;border-radius:100px;
    padding:13px 26px;font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;display:flex;align-items:center;gap:8px;
    box-shadow:0 6px 16px -6px rgba(47,111,98,.5);
  }
  .empty-cta:active{transform:scale(.97);}
  .empty-hint{
    margin-top:16px;font-size:11.5px;color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
  }
  #file-input{display:none;}

  /* ---------- Document view ---------- */
  .doc-wrap{display:none;}
  .doc-wrap.active{display:block;}
  .doc-meta{
    padding:18px 20px 6px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .doc-title{
    font-family:'Lora',serif;font-weight:700;font-size:24px;line-height:1.25;
    color:var(--ink);word-break:break-word;
  }
  .doc-filename{
    margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--ink-soft);
  }
  .close-btn{
    flex-shrink:0;width:32px;height:32px;border-radius:50%;
    background:var(--line);border:none;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink-soft);
  }
  .close-btn:active{background:var(--line-strong);}
  .close-btn svg{width:15px;height:15px;}

  article.markdown-body{
    padding:14px 20px 100px;
    font-family:'Inter',sans-serif;font-size:16px;line-height:1.75;color:var(--ink);
    max-width:680px;margin:0 auto;
  }
  .markdown-body h1,.markdown-body h2,.markdown-body h3,
  .markdown-body h4,.markdown-body h5{
    font-family:'Lora',serif;font-weight:600;color:var(--ink);
    line-height:1.3;margin:1.5em 0 .5em;
  }
  .markdown-body h1{font-size:1.6em;border-bottom:1px solid var(--line);padding-bottom:.3em;}
  .markdown-body h2{font-size:1.35em;}
  .markdown-body h3{font-size:1.15em;}
  .markdown-body p{margin:.9em 0;}
  .markdown-body a{color:var(--accent);text-decoration-color:var(--line-strong);text-underline-offset:2px;}
  .markdown-body strong{font-weight:700;}
  .markdown-body em{font-style:italic;}
  .markdown-body blockquote{
    margin:1.2em 0;padding:2px 0 2px 16px;
    border-left:3px solid var(--accent);color:var(--ink-soft);font-style:italic;
  }
  .markdown-body code{
    font-family:'JetBrains Mono',monospace;font-size:.87em;
    background:var(--accent-soft);color:#204f45;padding:.15em .4em;border-radius:5px;
  }
  .markdown-body pre{
    background:#211F1B;color:#F4F1E8;padding:14px 16px;border-radius:10px;
    overflow-x:auto;margin:1.2em 0;-webkit-overflow-scrolling:touch;
  }
  .markdown-body pre code{background:none;color:inherit;padding:0;font-size:.85em;}
  .markdown-body ul,.markdown-body ol{padding-left:1.3em;margin:.9em 0;}
  .markdown-body li{margin:.35em 0;}
  .markdown-body img{max-width:100%;border-radius:8px;display:block;margin:1em 0;}
  .markdown-body hr{border:none;border-top:1px dashed var(--line-strong);margin:2em 0;}
  .markdown-body table{
    width:100%;border-collapse:collapse;margin:1.2em 0;font-size:.92em;
    display:block;overflow-x:auto;white-space:nowrap;
  }
  .markdown-body th,.markdown-body td{
    border:1px solid var(--line);padding:8px 10px;text-align:left;
  }
  .markdown-body th{background:var(--paper-raised);font-family:'Inter',sans-serif;font-weight:600;}

  .markdown-body .katex{font-size:1.05em;}
  .markdown-body .katex-display{
    overflow-x:auto;overflow-y:hidden;padding:6px 2px 10px;
    -webkit-overflow-scrolling:touch;
  }

  .error-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--danger);color:#fff;padding:12px 18px;border-radius:10px;
    font-size:13.5px;box-shadow:0 8px 24px -8px rgba(0,0,0,.35);
    opacity:0;transition:all .25s ease;pointer-events:none;max-width:88vw;text-align:center;
  }
  .error-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-mark">紙めくり</span>
        <span class="brand-sub">md viewer</span>
      </div>
      <button class="import-btn" id="topbar-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        インポート
      </button>
    </div>
    <div class="stitch"></div>
  </div>

  <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain">

  <div class="empty" id="empty-state">
    <div class="empty-corner">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M12 6 H44 L52 14 V58 H12 Z" fill="#FFFDF9" stroke="#D2CBBB" stroke-width="1.5"/>
        <path d="M44 6 V14 H52 Z" fill="#E4DFD3" stroke="#D2CBBB" stroke-width="1.5"/>
        <line x1="19" y1="26" x2="41" y2="26" stroke="#2F6F62" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="19" y1="33" x2="41" y2="33" stroke="#D2CBBB" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="19" y1="40" x2="34" y2="40" stroke="#D2CBBB" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>ページはまだ白紙</h1>
    <p>お手持ちの .md ファイルを選ぶと、ここに整えて表示するよ。</p>
    <button class="empty-cta" id="empty-import">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      ファイルを選ぶ
    </button>
    <div class="empty-hint">.md / .markdown ・ $数式$ 対応</div>
  </div>

  <div class="doc-wrap" id="doc-wrap">
    <div class="doc-meta">
      <div>
        <div class="doc-title" id="doc-title">Untitled</div>
        <div class="doc-filename" id="doc-filename">file.md</div>
      </div>
      <button class="close-btn" id="close-doc" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <article class="markdown-body" id="doc-content"></article>
  </div>

  <div class="error-toast" id="error-toast"></div>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  const fileInput   = document.getElementById('file-input');
  const emptyState  = document.getElementById('empty-state');
  const docWrap     = document.getElementById('doc-wrap');
  const docTitle    = document.getElementById('doc-title');
  const docFilename = document.getElementById('doc-filename');
  const docContent  = document.getElementById('doc-content');
  const errorToast  = document.getElementById('error-toast');

  function openPicker(){ fileInput.click(); }
  document.getElementById('topbar-import').addEventListener('click', openPicker);
  document.getElementById('empty-import').addEventListener('click', openPicker);
  document.getElementById('close-doc').addEventListener('click', showEmpty);

  fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) loadFile(f);
    fileInput.value = '';
  });

  function showError(msg){
    errorToast.textContent = msg;
    errorToast.classList.add('show');
    setTimeout(() => errorToast.classList.remove('show'), 2600);
  }

  function showEmpty(){
    docWrap.classList.remove('active');
    emptyState.style.display = 'flex';
  }

  function extractTitle(md, fallback){
    const m = md.match(/^\s{0,3}#\s+(.+)$/m);
    return m ? m[1].trim() : fallback;
  }

  // ---- math protection: pull $...$ / $$...$$ out before marked touches them ----
  function protectMath(md){
    const store = [];
    const mark = (i) => `\u27E6MATH${i}\u27E7`;
    const segments = md.split(/(```[\s\S]*?```|`[^`\n]*?`)/g); // leave fenced/inline code untouched
    const processed = segments.map((seg, si) => {
      const isCode = si % 2 === 1; // split with capture group alternates code / non-code
      if (isCode) return seg;
      let s = seg.replace(/\$\$([\s\S]+?)\$\$/g, (m) => mark(store.push(m) - 1));
      s = s.replace(/(^|[^\\])\$([^\n$]+?[^\\\n])\$/g, (m, pre, expr) => pre + mark(store.push('$' + expr + '$') - 1));
      return s;
    });
    return { text: processed.join(''), store };
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function restoreMath(html, store){
    return html.replace(/\u27E6MATH(\d+)\u27E7/g, (m, i) => escapeHtml(store[Number(i)]));
  }

  function renderMath(container){
    if (window.renderMathInElement){
      renderMathInElement(container, {
        delimiters: [
          {left:'$$', right:'$$', display:true},
          {left:'$', right:'$', display:false}
        ],
        throwOnError:false
      });
    }
  }

  function loadFile(file){
    const validExt = /\.(md|markdown|txt)$/i.test(file.name);
    if (!validExt){
      showError('.md / .markdown ファイルを選んでね');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const raw = e.target.result;
      let html;
      try{
        const { text, store } = protectMath(raw);
        let parsed = marked.parse(text);
        parsed = restoreMath(parsed, store);
        html = window.DOMPurify ? DOMPurify.sanitize(parsed) : parsed;
      }catch(err){
        showError('読み込みに失敗したみたい');
        return;
      }
      docTitle.textContent = extractTitle(raw, file.name.replace(/\.(md|markdown|txt)$/i,''));
      docFilename.textContent = file.name;
      docContent.innerHTML = html;
      renderMath(docContent);
      emptyState.style.display = 'none';
      docWrap.classList.add('active');
      window.scrollTo(0,0);
    };
    reader.onerror = () => showError('ファイルを読み込めなかった');
    reader.readAsText(file, 'UTF-8');
  }

  // drag & drop (mainly for desktop preview, harmless on mobile)
  ['dragover','dragenter'].forEach(evt=>{
    emptyState.addEventListener(evt, e=>{
      e.preventDefault(); emptyState.classList.add('dragover');
    });
  });
  ['dragleave','drop'].forEach(evt=>{
    emptyState.addEventListener(evt, e=>{
      e.preventDefault(); emptyState.classList.remove('dragover');
    });
  });
  emptyState.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
</script>
</body>
</html>
