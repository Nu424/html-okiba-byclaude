<style>
  :root{
    --ink:#060811;
    --ink-2:#0c1120;
    --panel:rgba(14,20,36,.82);
    --line:rgba(140,165,205,.18);
    --text:#e9eefa;
    --muted:#8294b1;
    --pos:#ffb020;
    --neg:#2ed9c3;
    --hi:#ffd88a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  canvas#stage{position:fixed;inset:0;display:block}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

  /* ---------- 左パネル ---------- */
  #panel{
    position:fixed;top:0;left:0;bottom:0;width:296px;
    background:var(--panel);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-right:1px solid var(--line);
    padding:20px 18px 28px;
    overflow-y:auto;overscroll-behavior:contain;
    z-index:10;
  }
  #panel::-webkit-scrollbar{width:6px}
  #panel::-webkit-scrollbar-thumb{background:rgba(140,165,205,.25);border-radius:3px}

  .brand{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .brand b{color:var(--pos);font-weight:500}
  h1{font-size:15px;font-weight:500;margin:8px 0 20px;letter-spacing:.02em}

  .eyebrow{
    font-size:10px;letter-spacing:.18em;color:var(--muted);
    text-transform:uppercase;margin:22px 0 8px;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

  .shell{margin-bottom:12px}
  .shell-n{
    font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:5px;
  }
  .row{display:flex;flex-wrap:wrap;gap:5px}
  button.orb{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;line-height:1;
    padding:7px 8px;min-width:34px;
    color:var(--text);
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    border-radius:5px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,transform .1s;
  }
  button.orb:hover{background:rgba(255,176,32,.12);border-color:rgba(255,176,32,.45)}
  button.orb:active{transform:translateY(1px)}
  button.orb.on{
    background:var(--pos);border-color:var(--pos);color:#1a1204;font-weight:600;
  }
  button.orb sub{font-size:9px}
  button.orb sup{font-size:9px}
  button.orb:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

  .ctl{margin:12px 0}
  .ctl label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
  .ctl label span{color:var(--text);font-family:"IBM Plex Mono",monospace}
  input[type=range]{
    width:100%;height:2px;background:var(--line);border-radius:2px;
    -webkit-appearance:none;appearance:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--text);border:none;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--text);border:none;
  }
  .toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  button.tg{
    font-size:11px;padding:6px 10px;border-radius:5px;cursor:pointer;
    color:var(--muted);background:transparent;border:1px solid var(--line);
    font-family:"Zen Kaku Gothic New",sans-serif;
    transition:color .15s,border-color .15s,background .15s;
  }
  button.tg:hover{color:var(--text)}
  button.tg.on{color:var(--neg);border-color:rgba(46,217,195,.5);background:rgba(46,217,195,.1)}

  /* ---------- 右上：量子数カード ---------- */
  #info{
    position:fixed;top:16px;right:16px;width:250px;z-index:10;
    background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:8px;padding:16px 16px 12px;
  }
  #title{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:400;letter-spacing:-.01em}
  #title sub{font-size:15px;letter-spacing:0}
  #title sup{font-size:15px}
  #title em{color:var(--pos);font-style:normal}
  #sub{font-size:11px;color:var(--muted);margin-top:3px}
  .qn{display:flex;gap:6px;margin:14px 0 12px}
  .qn div{
    flex:1;text-align:center;padding:7px 0 6px;
    border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.02);
  }
  .qn i{display:block;font-size:9px;color:var(--muted);font-style:italic;font-family:"IBM Plex Mono",monospace}
  .qn b{display:block;font-size:16px;font-weight:400;font-family:"IBM Plex Mono",monospace;margin-top:2px}
  .facts{font-size:11px;color:var(--muted);line-height:1.75;border-top:1px solid var(--line);padding-top:9px}
  .facts span{color:var(--text);font-family:"IBM Plex Mono",monospace}
  #radial{width:100%;height:74px;display:block;margin-top:10px}
  .rcap{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;margin-top:-2px}

  /* ---------- 右下：凡例 ---------- */
  #legend{
    position:fixed;right:16px;bottom:16px;z-index:10;
    display:flex;gap:14px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:8px 12px;font-size:11px;color:var(--muted);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  }
  #legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  #hint{
    position:fixed;left:314px;bottom:16px;z-index:10;font-size:11px;color:var(--muted);
  }
  @media (max-width:820px){
    #panel{width:100%;height:auto;bottom:auto;max-height:47vh;border-right:none;border-bottom:1px solid var(--line)}
    #info{top:auto;bottom:56px;right:10px;left:10px;width:auto}
    .qn{margin:10px 0 8px}
    #radial{height:56px}
    #legend{bottom:10px;left:10px;right:auto}
    #hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="stage"></canvas>

<aside id="panel">
  <div class="brand mono">Hydrogenic <b>ψ</b><sub>n,l,m</sub></div>
  <h1>原子軌道 3Dエクスプローラ</h1>

  <div class="eyebrow mono">軌道を選ぶ</div>
  <div id="picker"></div>

  <div class="eyebrow mono">見え方</div>
  <div class="ctl">
    <label>点の数 <span id="vCount">60,000</span></label>
    <input type="range" id="sCount" min="8000" max="220000" step="4000" value="60000">
  </div>
  <div class="ctl">
    <label>点の大きさ <span id="vSize">1.0</span></label>
    <input type="range" id="sSize" min="0.4" max="2.6" step="0.1" value="1.0">
  </div>
  <div class="ctl">
    <label>濃さ <span id="vOpac">0.42</span></label>
    <input type="range" id="sOpac" min="0.08" max="1" step="0.02" value="0.42">
  </div>
  <div class="toggles">
    <button class="tg on" id="tSpin">自動回転</button>
    <button class="tg on" id="tAxes">座標軸</button>
    <button class="tg" id="tCut">半分に切る</button>
    <button class="tg" id="tReset">視点を戻す</button>
  </div>
</aside>

<section id="info">
  <div id="title" class="mono">1<em>s</em></div>
  <div id="sub">基底状態・球対称</div>
  <div class="qn mono">
    <div><i>n</i><b id="qn">1</b></div>
    <div><i>ℓ</i><b id="ql">0</b></div>
    <div><i>m</i><b id="qm">0</b></div>
  </div>
  <div class="facts">
    節面（角度）: <span id="fAng">0</span> ／ 節（動径）: <span id="fRad">0</span><br>
    平均距離 ⟨r⟩: <span id="fR">1.5</span> a₀
  </div>
  <canvas id="radial"></canvas>
  <div class="rcap mono"><span>動径分布 4πr²R²</span><span id="rmaxlab">0–8 a₀</span></div>
</section>

<div id="legend">
  <span><i style="background:var(--pos)"></i>ψ &gt; 0</span>
  <span><i style="background:var(--neg)"></i>ψ &lt; 0</span>
  <span style="opacity:.7">点の密度 ∝ |ψ|²</span>
</div>
<div id="hint">ドラッグで回転・ホイールで拡大</div>

<script>
/* ============================================================
   水素型波動関数  ψ(n,l,m) = R_nl(r) · Y_lm(θ,φ)   （a₀ = 1）
   ============================================================ */
const F = [1];
for (let i = 1; i < 30; i++) F[i] = F[i-1] * i;

// 一般化ラゲール多項式 L_n^a(x)
function laguerre(n, a, x){
  if (n === 0) return 1;
  let l0 = 1, l1 = 1 + a - x;
  for (let k = 1; k < n; k++){
    const l2 = ((2*k + 1 + a - x) * l1 - (k + a) * l0) / (k + 1);
    l0 = l1; l1 = l2;
  }
  return l1;
}
// 動径関数 R_nl(r)
function radial(n, l, r){
  const rho = 2 * r / n;
  const norm = Math.sqrt(Math.pow(2/n, 3) * F[n-l-1] / (2*n*F[n+l]));
  return norm * Math.exp(-rho/2) * Math.pow(rho, l) * laguerre(n-l-1, 2*l+1, rho);
}
// ルジャンドル陪関数 P_l^m(x)
function plm(l, m, x){
  let pmm = 1;
  if (m > 0){
    const s = Math.sqrt(Math.max(0, (1-x)*(1+x)));
    let f = 1;
    for (let i = 1; i <= m; i++){ pmm *= -f * s; f += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2*m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++){
    pll = ((2*ll - 1) * x * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}
// 実球面調和関数
function realY(l, m, ct, phi){
  const am = Math.abs(m);
  const N = Math.sqrt((2*l + 1) / (4*Math.PI) * F[l-am] / F[l+am]);
  const P = plm(l, am, ct);
  if (m === 0) return N * P;
  const t = am * phi;
  return Math.SQRT2 * N * P * (m > 0 ? Math.cos(t) : Math.sin(t));
}

/* ============================================================
   軌道カタログ
   ============================================================ */
const LBL = {
  0: [[0, 's', '球対称。ここが電子密度の芯']],
  1: [[1,'p<sub>x</sub>','x軸に沿った亜鈴型'],[-1,'p<sub>y</sub>','y軸に沿った亜鈴型'],[0,'p<sub>z</sub>','z軸に沿った亜鈴型']],
  2: [[-2,'d<sub>xy</sub>','xy面内の四つ葉'],[1,'d<sub>xz</sub>','xz面内の四つ葉'],[-1,'d<sub>yz</sub>','yz面内の四つ葉'],
      [2,'d<sub>x²−y²</sub>','x軸・y軸方向に伸びる四つ葉'],[0,'d<sub>z²</sub>','z軸の亜鈴＋ドーナツ']],
  3: [[0,'f<sub>z³</sub>','z軸型'],[1,'f<sub>xz²</sub>','xz²型'],[-1,'f<sub>yz²</sub>','yz²型'],
      [2,'f<sub>z(x²−y²)</sub>','z(x²−y²)型'],[-2,'f<sub>xyz</sub>','八つ葉（xyz型）'],
      [3,'f<sub>x(x²−3y²)</sub>','六つ葉（xy面内）'],[-3,'f<sub>y(3x²−y²)</sub>','六つ葉（xy面内）']]
};
const SUBL = ['s','p','d','f'];
let cur = {n:1, l:0, m:0};

/* ---------- ピッカー生成 ---------- */
const picker = document.getElementById('picker');
for (let n = 1; n <= 5; n++){
  const shell = document.createElement('div'); shell.className = 'shell';
  const head = document.createElement('div'); head.className = 'shell-n mono';
  head.textContent = 'n = ' + n + '  ·  ' + 'KLMNO'[n-1] + '殻';
  shell.appendChild(head);
  const row = document.createElement('div'); row.className = 'row';
  for (let l = 0; l < Math.min(n, 4); l++){
    for (const [m, label] of LBL[l]){
      const b = document.createElement('button');
      b.className = 'orb';
      b.innerHTML = n + label;
      b.dataset.k = [n,l,m].join(',');
      b.onclick = () => select(n, l, m);
      row.appendChild(b);
    }
  }
  shell.appendChild(row);
  picker.appendChild(shell);
}

/* ============================================================
   3Dシーン
   ============================================================ */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x060811, 1);
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060811, 0.0);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 4000);
const group = new THREE.Group();
scene.add(group);

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const material = new THREE.PointsMaterial({
  size: 1, vertexColors: true, transparent: true, opacity: 0.42,
  depthWrite: false, sizeAttenuation: true
});
let cloud = null;

// 座標軸
const axes = new THREE.Group();
function buildAxes(len){
  axes.clear();
  const dirs = [[1,0,0],[0,1,0],[0,0,1]];
  dirs.forEach(d => {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-d[0]*len, -d[1]*len, -d[2]*len),
      new THREE.Vector3(d[0]*len, d[1]*len, d[2]*len)
    ]);
    axes.add(new THREE.Line(g, new THREE.LineBasicMaterial({
      color: 0x8294b1, transparent: true, opacity: 0.28
    })));
    // 正方向の先端マーカー
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(len*0.012, 8, 8),
      new THREE.MeshBasicMaterial({color: 0x8294b1})
    );
    s.position.set(d[0]*len, d[1]*len, d[2]*len);
    axes.add(s);
  });
}
group.add(axes);

/* ---------- 動径サンプラ（逆関数法） ---------- */
let radialCDF = null, rGrid = null, rMax = 8;

function buildRadial(n, l){
  rMax = 2.6 * n * n + 6;
  const M = 3000;
  rGrid = new Float64Array(M);
  const w = new Float64Array(M);
  radialCDF = new Float64Array(M);
  let acc = 0;
  for (let i = 0; i < M; i++){
    const r = rMax * (i + 0.5) / M;
    const R = radial(n, l, r);
    rGrid[i] = r;
    w[i] = r * r * R * R;
    acc += w[i];
    radialCDF[i] = acc;
  }
  for (let i = 0; i < M; i++) radialCDF[i] /= acc;
  return w;
}
function sampleR(){
  const u = Math.random();
  let lo = 0, hi = radialCDF.length - 1;
  while (lo < hi){ const mid = (lo + hi) >> 1; if (radialCDF[mid] < u) lo = mid + 1; else hi = mid; }
  return rGrid[lo];
}

/* ---------- 点群生成 ---------- */
function build(){
  const {n, l, m} = cur;
  const N = +document.getElementById('sCount').value;
  buildRadial(n, l);

  // 角度部の最大値を推定
  let ymax = 0;
  for (let i = 0; i < 6000; i++){
    const ct = 2*Math.random() - 1, ph = 2*Math.PI*Math.random();
    ymax = Math.max(ymax, Math.abs(realY(l, m, ct, ph)));
  }
  ymax = ymax * ymax * 1.05;

  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const P = [1.0, 0.69, 0.13], Nc = [0.18, 0.85, 0.76];

  let k = 0, guard = 0;
  while (k < N && guard < N * 400){
    guard++;
    const ct = 2*Math.random() - 1;
    const ph = 2*Math.PI*Math.random();
    const y = realY(l, m, ct, ph);
    if (y*y < Math.random() * ymax) continue;   // 角度部の棄却
    const r = sampleR();
    const st = Math.sqrt(1 - ct*ct);
    const i3 = k*3;
    pos[i3]   = r * st * Math.cos(ph);
    pos[i3+1] = r * st * Math.sin(ph);
    pos[i3+2] = r * ct;
    const sgn = y * radial(n, l, r) >= 0 ? P : Nc;
    col[i3] = sgn[0]; col[i3+1] = sgn[1]; col[i3+2] = sgn[2];
    k++;
  }

  if (cloud){ group.remove(cloud); cloud.geometry.dispose(); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, k*3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col.subarray(0, k*3), 3));
  cloud = new THREE.Points(geo, material);
  group.add(cloud);

  material.size = rMax * 0.0055 * (+document.getElementById('sSize').value);
  buildAxes(rMax * 0.92);
  fitCamera();
  drawRadial();
}

/* ---------- 情報カード & 動径分布プロット ---------- */
function labelOf(n, l, m){
  const e = LBL[l].find(x => x[0] === m);
  return [n + e[1].replace(/^([spdf])/, '<em>$1</em>'), e[2]];
}
function drawRadial(){
  const {n, l} = cur;
  const c = document.getElementById('radial');
  const dpr = Math.min(devicePixelRatio, 2);
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  x.clearRect(0, 0, w, h);

  const M = 400, ys = [];
  let mx = 0;
  for (let i = 0; i < M; i++){
    const r = rMax * i / (M - 1);
    const R = radial(n, l, r);
    const v = r * r * R * R;
    ys.push(v); mx = Math.max(mx, v);
  }
  // 動径節（R = 0）の位置
  const nodes = [];
  for (let i = 1; i < M; i++){
    const a = radial(n, l, rMax*(i-1)/(M-1)), b = radial(n, l, rMax*i/(M-1));
    if (a * b < 0) nodes.push(rMax * i / (M-1));
  }
  x.strokeStyle = 'rgba(140,165,205,.22)';
  x.beginPath(); x.moveTo(0, h-1); x.lineTo(w, h-1); x.stroke();
  nodes.forEach(r => {
    const px = r / rMax * w;
    x.strokeStyle = 'rgba(46,217,195,.55)'; x.setLineDash([2,3]);
    x.beginPath(); x.moveTo(px, 0); x.lineTo(px, h-1); x.stroke(); x.setLineDash([]);
  });
  const grad = x.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(255,176,32,.35)');
  grad.addColorStop(1, 'rgba(255,176,32,0)');
  x.beginPath(); x.moveTo(0, h-1);
  ys.forEach((v, i) => x.lineTo(i/(M-1)*w, h - 1 - v/mx * (h-6)));
  x.lineTo(w, h-1); x.closePath(); x.fillStyle = grad; x.fill();
  x.beginPath();
  ys.forEach((v, i) => { const px = i/(M-1)*w, py = h - 1 - v/mx*(h-6); i ? x.lineTo(px,py) : x.moveTo(px,py); });
  x.strokeStyle = '#ffb020'; x.lineWidth = 1.4; x.stroke();

  document.getElementById('rmaxlab').textContent = '0–' + Math.round(rMax) + ' a₀';
}
function updateInfo(){
  const {n, l, m} = cur;
  const [t, s] = labelOf(n, l, m);
  document.getElementById('title').innerHTML = t;
  document.getElementById('sub').textContent = s;
  document.getElementById('qn').textContent = n;
  document.getElementById('ql').textContent = l + ' (' + SUBL[l] + ')';
  document.getElementById('qm').textContent = m > 0 ? '+' + m : m;
  document.getElementById('fAng').textContent = l;
  document.getElementById('fRad').textContent = n - l - 1;
  document.getElementById('fR').textContent = ((3*n*n - l*(l+1)) / 2).toFixed(1);
  document.querySelectorAll('button.orb').forEach(b =>
    b.classList.toggle('on', b.dataset.k === [n,l,m].join(',')));
}
function select(n, l, m){ cur = {n, l, m}; updateInfo(); build(); }

/* ============================================================
   カメラ操作（自前オービット）
   ============================================================ */
let dist = 30, yaw = 0.6, pitch = 0.5, spin = true, drag = false, px = 0, py = 0;
function fitCamera(){ dist = rMax * 2.5; }
function updateCamera(){
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  camera.position.set(dist*cp*Math.sin(yaw), dist*sp, dist*cp*Math.cos(yaw));
  camera.lookAt(0, 0, 0);
}
canvas.addEventListener('pointerdown', e => { drag = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => drag = false);
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  yaw -= (e.clientX - px) * 0.006;
  pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - py) * 0.006));
  px = e.clientX; py = e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(rMax*0.35, Math.min(rMax*8, dist * (1 + Math.sign(e.deltaY)*0.1)));
}, {passive:false});

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); drawRadial(); });

function loop(){
  requestAnimationFrame(loop);
  if (spin && !drag) group.rotation.y += 0.0022;
  updateCamera();
  renderer.render(scene, camera);
}

/* ---------- UI配線 ---------- */
const $ = id => document.getElementById(id);
$('sCount').oninput = e => { $('vCount').textContent = (+e.target.value).toLocaleString(); };
$('sCount').onchange = build;
$('sSize').oninput = e => {
  $('vSize').textContent = (+e.target.value).toFixed(1);
  material.size = rMax * 0.0055 * (+e.target.value);
};
$('sOpac').oninput = e => {
  $('vOpac').textContent = (+e.target.value).toFixed(2);
  material.opacity = +e.target.value;
};
$('tSpin').onclick = e => { spin = !spin; e.target.classList.toggle('on', spin); };
$('tAxes').onclick = e => { axes.visible = !axes.visible; e.target.classList.toggle('on', axes.visible); };
$('tCut').onclick = e => {
  const on = material.clippingPlanes === null || material.clippingPlanes.length === 0;
  material.clippingPlanes = on ? [clipPlane] : [];
  material.needsUpdate = true;
  e.target.classList.toggle('on', on);
};
$('tReset').onclick = () => { yaw = 0.6; pitch = 0.5; group.rotation.set(0,0,0); fitCamera(); };
addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); $('tSpin').click(); }
});

resize();
updateInfo();
build();
loop();
</script>
